<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Prototipo CRM Parra</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de escritorio de oficina — barra fija arriba, contenido en una columna ancha, tablas densas y botones claros; las ayudas son una franja amarilla tipo nota al tope de cada pantalla */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --soft:#eef2f6; --line:#d3dbe4; --fg:#1b2632; --muted:#5b6978;
  --accent:#2453c2; --accent-soft:#e2eafb; --accent-fg:#ffffff;
  --good:#1f7a4d; --good-soft:#e1f3e9; --warn:#9a5b00; --warn-soft:#fdf0d9; --bad:#b4322c; --bad-soft:#fbe6e4;
  --note:#fff4cc; --note-line:#e8d68e;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161b; --surface:#1b2129; --soft:#232a33; --line:#36414d; --fg:#e4e9ef; --muted:#9aa7b5;
  --accent:#7ea6ff; --accent-soft:#1e2c48; --accent-fg:#0f1520;
  --good:#5fd39a; --good-soft:#163527; --warn:#f2b25a; --warn-soft:#3a2a1b; --bad:#ff8a80; --bad-soft:#3a1d1b;
  --note:#353020; --note-line:#5a4f2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1b2129; --soft:#232a33; --line:#36414d; --fg:#e4e9ef; --muted:#9aa7b5;
  --accent:#7ea6ff; --accent-soft:#1e2c48; --accent-fg:#0f1520;
  --good:#5fd39a; --good-soft:#163527; --warn:#f2b25a; --warn-soft:#3a2a1b; --bad:#ff8a80; --bad-soft:#3a1d1b;
  --note:#353020; --note-line:#5a4f2c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15.5px}
button{font:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
.brand small{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.crumb{color:var(--muted);font-size:13.5px;min-width:0}
.listsearch{margin-left:auto;flex:0 1 300px;min-width:180px;align-self:center;margin-bottom:6px}
.top .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:700;font-size:13.5px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:focus-visible,.lnk:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{color:var(--accent);font-weight:700;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.lnk:hover{text-decoration:underline}
.lnk.h1l{font:inherit;color:inherit}.lnk.h1l:hover{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.help{background:var(--note);border:1px solid var(--note-line);border-radius:8px;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.help b{font-family:var(--display)}
.help .x{margin-left:auto;flex:none}
.lbl{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv{display:grid;gap:2px}.kv b{font-family:var(--display);font-size:15px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
tr.off td{color:var(--muted);text-decoration:line-through}
tr.paid td{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.plain{border-color:var(--line);color:var(--muted)}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.idx div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:grid}
.idx b{font-family:var(--display)}.idx span{font:400 12px var(--mono);color:var(--muted)}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.acc button{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:700;display:grid;gap:2px}
.acc button:hover{border-color:var(--accent)}
.acc button span{font-weight:400;font-size:12.5px;color:var(--muted)}
.acc .badge{position:absolute;top:8px;right:10px;background:var(--accent);color:var(--accent-fg);border-radius:999px;font:500 11px var(--mono);padding:1px 7px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px}
.tab.on{background:var(--surface);border-color:var(--line);color:var(--fg);margin-bottom:-1px}
.circ{display:inline-grid;place-items:center;min-width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);font:500 12px var(--mono);cursor:pointer;background:var(--surface);color:var(--fg)}
.circ:hover{border-color:var(--accent);color:var(--accent)}
.due{display:grid;gap:4px;font:400 12px var(--mono);min-width:96px}
.track{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.track span{display:block;height:100%}
.icons{display:inline-flex;gap:2px;margin-top:3px}
.icon{display:inline-grid;place-items:center;width:28px;height:26px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;padding:0}
.icon:hover{border-color:var(--line);color:var(--accent)}
.icon svg{width:15px;height:15px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent);transform:scale(1.15)}
.field{display:grid;gap:4px}
.field span{font-size:12.5px;color:var(--muted)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tot div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid}
.tot b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.eq{display:grid;font-variant-numeric:tabular-nums}
.eq div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.eq div.t{font-weight:700;border-bottom:0;font-size:15.5px}
.search{position:relative}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;z-index:5;max-height:360px;overflow:auto;padding:6px}
.results button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:6px;cursor:pointer;color:var(--fg)}
.results button:hover,.results button:focus-visible{background:var(--soft)}
.results .k{font:500 10.5px var(--mono);text-transform:uppercase;color:var(--muted);width:76px;flex:none;padding-top:2px}
.overlay{position:fixed;inset:0;background:#0007;z-index:20;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:18px;display:grid;gap:14px;border:1px solid var(--line)}
.modal.wide{max-width:760px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-weight:700;max-width:calc(100% - 32px)}
.pdf{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:10px;min-height:280px}
.pdf span{height:9px;border-radius:5px;background:var(--line)}.pdf span.s{width:55%}.pdf span.h{width:40%;height:14px;background:var(--muted)}
.qr{width:96px;height:96px;background:
  repeating-conic-gradient(var(--fg) 0 25%,transparent 0 50%) 0 0/24px 24px;border:6px solid var(--surface);outline:1px solid var(--line)}
.phone{max-width:340px;margin:0 auto;border:3px solid var(--line);border-radius:28px;padding:18px;display:grid;gap:12px;background:var(--bg)}
.empty{color:var(--muted);text-align:center;padding:18px}
.sum{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
@media (max-width:700px){
  h1{font-size:20px}body{font-size:15px}
  .top .in{gap:6px 10px}.crumb{flex:1 1 100%;order:3;font-size:13px}.top .sp{gap:4px}.top .btn.sm{padding:6px 8px;font-size:12px}
  main{padding-block:14px 40px}.wrap{gap:14px}.card{padding:12px}
  input,select,textarea{font-size:16px}
  .listsearch{flex:1 1 100%;margin-left:0;order:-1;margin-bottom:8px;min-width:0}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs .tab{flex:none}
  .tabs:has(.listsearch){flex-wrap:wrap}
  .acc,.idx{grid-template-columns:1fr 1fr}
  .acc button{padding:10px 36px 10px 12px}
  .due{min-width:120px}
  .help{font-size:13px;padding:9px 12px}
  .scroll{overflow:visible}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px;background:var(--surface)}
  table.resp tr.paid,table.resp tr.off{background:var(--soft)}
  table.resp td{border:0;padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right;min-width:0;overflow-wrap:anywhere}
  table.resp td+td{border-top:1px dashed var(--line)}
  table.resp td::before{content:attr(data-label);font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;flex:none;max-width:45%}
  table.resp td:not([data-label])::before,table.resp td[data-label=""]::before{content:none}
  table.resp td:empty{display:none}
  table.resp td.empty{display:block;text-align:center}
  table.resp td>br{display:none}
  .circ{min-width:44px;height:44px}
  .row[style*="flex-end"]{justify-content:stretch!important}.row[style*="flex-end"]>.btn{flex:1 1 auto}
  .modal{padding:14px}.modal .actions .btn{flex:1 1 auto}
  .tot b{font-size:16px}
}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);align-items:start}
.side{position:sticky;top:var(--toph,57px);height:calc(100vh - var(--toph,57px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px 24px max(10px,env(safe-area-inset-left,0px));display:grid;align-content:start;gap:2px}
.side .grp{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--fg);cursor:pointer;font-size:14px}
.side button:hover{background:var(--soft)}
.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side button svg{width:16px;height:16px;flex:none;color:var(--muted)}
.side button.on svg{color:var(--accent)}
.side button .soon{margin-left:auto;font:500 10px var(--mono);color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 6px}
.side button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#menu{display:none}
.scrim{display:none}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px;color:var(--fg)}
.kpi button:hover{border-color:var(--accent)}
.kpi b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}
.conf{font-size:11.5px}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pdf .hl{background:var(--note-line)}
@media (max-width:1000px){
  .shell{display:block}
  #menu{display:inline-flex}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(290px,85vw);z-index:15;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 24px #0003;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:#0006;z-index:14}
  .split2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
/* ======= utilidades ======= */
const HOY=new Date('2026-10-29T12:00:00');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'− ':'')+'$ '+Math.abs(Math.round(n)).toLocaleString('es-AR');
const d=s=>new Date(s+'T12:00:00');
const fdate=s=>{const x=d(s);return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+x.getFullYear();};
const days=(a,b)=>Math.round((b-a)/864e5);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesTxt=m=>MESES[Number(m.slice(5,7))-1]+'/'+m.slice(0,4);
const IC={
 phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18" r="1.3" fill="currentColor"/></svg>',
 person:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="currentColor"/></svg>',
 doc:'<svg viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6z" fill="currentColor"/></svg>',
 cta:'<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7h8M8 11h8M8 15h5" stroke="currentColor" stroke-width="2"/></svg>'};

/* ======= datos de ejemplo ======= */
function semilla(){
 const R=n=>Math.floor(Math.random()*n), pick=a=>a[R(a.length)], rnd=(a,b,st)=>Math.round((a+Math.random()*(b-a))/st)*st;
 const NOM=['Lucía','Martín','Carla','Diego','Paula','Jorge','Sofía','Nicolás','Valeria','Matías','Romina','Gustavo','Florencia','Leandro','Natalia','Pablo','Julieta','Sergio','Micaela','Ezequiel','Graciela','Hugo','Ana','Ramón','Silvia','Nora','Luis','Marta'];

 const CALLES=['Monteagudo','San Martín','Av. Eva Perón','Balcarce','Av. Calchaquí','Jorge Newbery','Sallarés','España','Mitre','Belgrano','Av. Hipólito Yrigoyen','Alberdi'];
 const LAB=['Empleada administrativa','Docente','Enfermera','Comerciante','Chofer','Albañil','Cajera','Técnico electricista','Vendedor','Monotributista'];
 const usados=new Set();const nombre=()=>{let n;do{n=pick(NOM)+' '+pick(APE);}while(usados.has(n));usados.add(n);return n;};
 const dni=()=>String(rnd(12,40,1))+'.'+String(R(1000)).padStart(3,'0')+'.'+String(R(1000)).padStart(3,'0');
 const tel=()=>'11 '+String(4000+R(5999))+'-'+String(R(10000)).padStart(4,'0');
 const P={},PR={},C={};
 const nO=6;for(let i=1;i<=nO;i++){const n=nombre(),c=Math.random()<.7;P['O'+i]={n,dni:dni(),tel:tel(),mail:Math.random()<.5?n.split(' ')[0].toLowerCase()+'@ejemplo.com':'',cbu:c?'Cargado':'Falta cargar',cobro:c?'Transferencia':'Efectivo'};}
 const ESC=['aldia','aldia','aldia','debe1','debe2','debe3','parcial','afavor','adelantado','pagotarde'].sort(()=>Math.random()-.5);
 const NC=10;let gi=1;
 for(let i=1;i<=NC;i++){
  const pr='P'+i,cp='99-'+(900+i),inq='I'+i,n=nombre();
  P[inq]={n,dni:dni(),tel:tel(),mail:n.split(' ')[0].toLowerCase()+i+'@ejemplo.com',lab:pick(LAB)};
  const com=Math.random()<.2;
  const due=i===3?[['O1',50],['O2',50]]:[['O'+(1+R(nO)),100]];

 else{const pref=modo==='Inquilinos'?'I':'O';lista=`<div class="scroll"><table><thead><tr><th>Nombre</th><th>DNI</th><th>Teléfono</th><th>Contratos</th></tr></thead><tbody>${Object.keys(S.P).filter(k=>k[0]===pref).map(k=>`<tr data-s="${esc((pers(k).n+' '+pers(k).dni+' '+rolesDe(k).map(r=>r.cp).join(' ')).toLowerCase())}"><td>${nombre(k)}</td><td>${pers(k).dni}</td><td>${pers(k).tel}</td><td>${rolesDe(k).map(r=>L(r.cp,'contrato',{cp:r.cp})).join(' ')}</td></tr>`).join('')}</tbody></table></div>`;}
 return `${help('Es lo primero que se ve al entrar. Arriba están los índices, en el medio los 6 accesos a las tareas del mes, y abajo la lista de contratos por número de carpeta, con un buscador que la filtra por carpeta, dirección, nombre o DNI. En todo el sistema, cada nombre, dirección y número de carpeta se puede tocar para abrir su archivo. Tocá el número de carpeta para ver el contrato, el nombre del inquilino para cobrarle, y los íconos para el acceso al portal, el archivo de la persona, los documentos y la cuenta corriente.')}
  <div><div class="lbl" style="margin-bottom:6px">Índices · valores de ejemplo</div><div class="idx">${[['ICL','1,0412'],['Casa Propia','1,0318'],['IPC','2,1%'],['RIPTE','1,9%'],['CAC','2,4%'],['UVA','1.312,55']].map(x=>`<div><b>${x[0]}</b><span>${x[1]} · sep/2026</span></div>`).join('')}</div></div>
 <div class="acc">${ac.map(a=>`<button type="button" data-go="${a[0]}" data-p="{}">${a[1]}<span>${a[2]}</span>${a[3]?`<i class="badge">${a[3]}</i>`:''}</button>`).join('')}</div>
 <div class="card"><div class="tabs">${Object.keys(cnt).map(k=>`<button type="button" class="tab${k===modo?' on':''}" data-modo="${k}">${k} <span class="muted">${cnt[k]}</span></button>`).join('')}<input id="fq" class="listsearch" type="search" placeholder="Buscar carpeta, dirección, nombre o DNI" aria-label="Buscar en la lista" autocomplete="off" value="${esc(p.f||'')}"></div>${lista}<p id="fnone" class="empty" hidden>Sin resultados para esa búsqueda.</p>

V.cobranza=p=>{
 const cp=p.cp,c=C(cp),tab=p.tab||'Datos principales';

  const ver=verCob(cp,p),mx=maxAde(cp),ade=p.ade||0;const hist=p.atrasar?S.cargos.filter(x=>x.carpeta===cp&&x.estado!=='pendiente'):[];

   <td class="num">${money(x.monto)} <button class="icon" type="button" data-act="ajuste" data-id="${x.id}" title="Ajustar monto" aria-label="Ajustar monto">✎</button></td>
   <td class="num">${pu.dias?`<label><input type="checkbox" data-pun="${x.id}" checked> ${pu.dias} días × 0,5% = ${money(pu.monto)}</label>`:x.perdon?'<span class="pill plain" title="'+esc(x.perdon)+'">perdonado</span>':'<span class="muted">—</span>'}</td>
   <td class="num"><b>${money(x.monto+pu.monto)}</b></td><td><button class="lnk" type="button" data-act="anular" data-id="${x.id}">Anular</button></td></tr>`;}).join('');
  const hrows=hist.map(x=>`<tr class="${x.estado==='anulado'?'off':'paid'}"><td></td><td>${fdate(x.vence)}</td><td>${x.cuenta}</td><td>${esc(x.desc)}</td><td class="num">${money(x.monto)}</td><td></td><td></td><td>${x.estado==='anulado'?'anulado':'pagado · recibo '+String(x.recibo).padStart(4,'0')}</td></tr>`).join('');
  const its=ver.filter(x=>sel.includes(x.id)),tot=its.reduce((a,x)=>a+x.monto+pun(x).monto,0),tp=its.reduce((a,x)=>a+pun(x).monto,0);
  body=`<div class="scroll"><table><thead><tr><th>Cobrar</th><th>Vence</th><th>Cuenta</th><th>Descripción</th><th class="num">Monto</th><th class="num">Punitorio</th><th class="num">Total</th><th>Acción</th></tr></thead><tbody>${hrows}${rows||`<tr><td colspan="8" class="empty">No debe nada vencido. Con "Cobrar hasta" o "Adelantar un período" se cobran por adelantado los meses que quiera, hasta el final del contrato.</td></tr>`}</tbody></table></div>
  <div class="tot"><div><span class="lbl">Total a abonar</span><b>${money(tot)}</b></div><div><span class="lbl">Punitorios</span><b>${money(tp)}</b></div><div><span class="lbl">Total abonado</span><input id="abon" type="number" min="0" step="1000" value="${p.abon??tot}" aria-label="Total abonado"></div></div>
  <div class="grid3"><label class="field"><span>Forma de pago</span><select id="forma"><option>Efectivo</option><option>Transferencia</option><option>Cheque</option></select></label>
   <label class="field"><span>Notas que salen en el recibo</span><input id="nota" placeholder="Ej.: El próximo mes aumenta el alquiler"></label></div>
  <div class="row" style="justify-content:flex-end">
   <button class="btn" type="button" data-act="atrasar">${p.atrasar?'Ocultar meses anteriores':'Atrasar período'}</button>
   <label class="row" style="gap:6px"><span class="muted" style="font-size:13px">Cobrar hasta</span><select id="hastames" style="width:auto" aria-label="Cobrar hasta el mes">${['<option value="0">Lo vencido</option>'].concat(Array.from({length:mx},(_,i)=>`<option value="${i+1}" ${ade===i+1?'selected':''}>${mesTxt(addMes('2026-10',i+1))}</option>`)).join('')}</select></label>
   <button class="btn" type="button" data-act="adelantar" ${ade>=mx?'disabled':''}>Adelantar un período</button>
   <button class="btn" type="button" data-go="cta" data-p='{"cp":"${cp}"}'>Cuenta corriente</button>
   <button class="btn" type="button" data-act="imprimir">Solo imprimir</button>
   <button class="btn primary" type="button" data-act="confirmar" ${its.length?'':'disabled'}>Confirmar pago</button></div>`;
 }else if(tab==='Conceptos extras'){
  body=`<p class="muted" style="margin:0">Un concepto extra es una regla que crea un cargo en cada mes del período elegido. Probá cargar unas expensas y mirá la vista previa.</p>
  <div class="grid3"><label class="field"><span>Concepto</span><select id="ce-con">${['Expensas','Tasa municipal','AySA','Edesur','Metrogas','Cochera','Seguro','IVA'].map(x=>`<option>${x}</option>`).join('')}</select></label>
   <label class="field"><span>Detalle</span><input id="ce-det" placeholder="Ej.: Extraordinarias portón"></label>
   <label class="field"><span>Monto por mes ($)</span><input id="ce-mon" type="number" min="0" step="1000" value="40000"></label>
   <label class="field"><span>Para el inquilino</span><select id="ce-inq"><option>Sumar al pago</option><option>Descontar del pago</option><option>Sin efecto</option></select></label>
   <label class="field"><span>Para el propietario</span><select id="ce-pro"><option>Sumar a lo que cobra</option><option>Descontar de lo que cobra</option><option>Sin efecto</option></select></label>
   <label class="field"><span>Meses</span><select id="ce-cant"><option value="1">Solo noviembre</option><option value="3" selected>Noviembre a enero</option><option value="6">Noviembre a abril</option></select></label></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="ce-prev">Vista previa</button><button class="btn primary" type="button" data-act="ce-save">Guardar</button></div><div id="ce-out"></div>`;
 }else if(tab==='Concepto compartido'){
  body=`<p class="muted" style="margin:0">Un gasto que se reparte entre varios contratos, con un % cada uno. Por ejemplo, un arreglo de un edificio con varias unidades.</p>
  <div class="grid3"><label class="field"><span>Gasto</span><input id="cc-g" value="Arreglo de la bomba de agua"></label><label class="field"><span>Monto total ($)</span><input id="cc-m" type="number" value="120000"></label></div>
  <div class="scroll"><table><thead><tr><th>Incluir</th><th>Carpeta</th><th>Dirección</th><th>%</th></tr></thead><tbody>${Object.keys(S.C).map(k=>`<tr><td><input type="checkbox" data-cc="${k}" ${k===cp?'checked':''}></td><td>${L(k,'contrato',{cp:k})}</td><td>${L(esc(S.PR[C(k).prop].dir),'propiedad',{pr:C(k).prop})}</td><td><input type="number" data-ccp="${k}" value="${k===cp?100:0}" style="max-width:90px"></td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" type="button" data-act="cc-save">Repartir y guardar</button></div>`;
 }else if(tab==='Concepto dividido'){
  body=`<p class="muted" style="margin:0">Un gasto de este contrato que se reparte entre el inquilino y el propietario. La parte del propietario se le descuenta en la liquidación.</p>
  <div class="grid3"><label class="field"><span>Gasto</span><input id="cd-g" value="Reparación de caño"></label><label class="field"><span>Monto ($)</span><input id="cd-m" type="number" value="80000"></label><label class="field"><span>% que paga el inquilino</span><input id="cd-p" type="number" value="50"></label></div>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" type="button" data-act="cd-save">Dividir y guardar</button></div>`;
 }else if(tab==='Concepto particular'){
  body=`<p class="muted" style="margin:0">Un cargo o un descuento único. Siempre lleva motivo.</p>
  <div class="grid3"><label class="field"><span>Concepto</span><input id="cp-g" value="Descuento por arreglo que pagó el inquilino"></label><label class="field"><span>Monto ($)</span><input id="cp-m" type="number" value="25000"></label>
  <label class="field"><span>Para el inquilino</span><select id="cp-t"><option>Descontar del pago</option><option>Sumar al pago</option></select></label><label class="field"><span>Motivo</span><input id="cp-mot" placeholder="Obligatorio"></label></div>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" type="button" data-act="cp-save">Guardar</button></div>`;
 }else{
  const rs=S.recibos.filter(r=>r.carpeta===cp).sort((a,b)=>b.n-a.n);
  body=rs.length?`<div class="scroll"><table><thead><tr><th>N°</th><th>Fecha</th><th>Forma</th><th class="num">Total</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td>${String(r.n).padStart(4,'0')}</td><td>${fdate(r.fecha)}</td><td>${r.forma}</td><td class="num">${money(r.total)}</td><td><button class="lnk" type="button" data-act="verrecibo" data-n="${r.n}">Ver · reimprimir · reenviar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Todavía no hay recibos de este contrato.</p>';
 }
 return `${help('Se abre tocando el nombre del inquilino en la lista. Muestra todo lo que debe a la fecha, con el punitorio a la vista (días de atraso × 0,5%). Marcá qué cobra, elegí cómo paga y tocá "Confirmar pago": aparece la revisión y después el recibo numerado. Nada se borra: el lápiz crea un ajuste con motivo, y anular o perdonar un punitorio también piden motivo.')}
 <div class="card"><div class="sum"><div class="kv"><span class="lbl">Inquilino</span><b>${nombre(c.inq)}</b></div><div class="kv"><span class="lbl">Carpeta</span>${L(cp,'contrato',{cp})}</div><div class="kv"><span class="lbl">Propiedad</span>${L(esc(prop(cp).dir),'propiedad',{pr:c.prop})}</div><div class="kv"><span class="lbl">Días de gracia</span>10, vence el día 10</div><div class="kv"><span class="lbl">Punitorio</span>0,5% diario</div><div class="kv"><span class="lbl">Fecha del cobro</span>${fdate('2026-10-29')} (hoy)</div></div>
 <div class="tabs">${tabs.map(t=>`<button type="button" class="tab${t===tab?' on':''}" data-tab="${t}">${t}</button>`).join('')}</div>${body}</div>`;
};

V.contrato=p=>{

 const prox=(()=>{const ini=d(c.desde);let m=new Date(ini);while(m<=HOY)m.setMonth(m.getMonth()+c.cada);return MESES[m.getMonth()].slice(0,3)+'/'+m.getFullYear();})();
 return `${help('Cada carpeta es un contrato. La renovación mantiene el número y un contrato nuevo toma el siguiente. Acá está todo el contrato junto, y se puede abrir el contrato firmado entero o descargarlo. Cada nombre y la dirección abren su propio archivo.')}
 <div class="card"><div class="sum"><div><span class="lbl">Carpeta ${cp}</span><h1>${L(esc(pr.dir),'propiedad',{pr:c.prop},'lnk h1l')}</h1><div class="row" style="margin-top:6px"><span class="pill ${rest<=90?'warn':'good'}">${rest<=90?'Vence en '+rest+' días':'Vigente'}</span><span class="pill plain">${c.tipo}</span></div></div>
  <div class="row"><button class="btn primary" type="button" data-act="visor" data-cp="${cp}">Abrir contrato firmado</button><button class="btn" type="button" data-act="descargar">Descargar</button></div></div>
 <div class="grid3"><div class="kv"><span class="lbl">Propiedad</span>${L(esc(pr.dir),'propiedad',{pr:c.prop})}</div><div class="kv"><span class="lbl">Inquilino</span>${nombre(c.inq)}</div><div class="kv"><span class="lbl">Propietario/s</span>${pr.due.map(x=>nombre(x[0])+` <span class="muted">${x[1]}%</span>`).join('<br>')}</div></div></div>
 <div class="grid3"><div class="card"><span class="lbl">Plazo</span><b>${fdate(c.desde)} → ${fdate(c.hasta)}</b><span class="muted">${c.cuotas} cuotas</span></div>

 <div class="grid2"><div class="card"><h3>Montos</h3><div class="eq"><div><span>Alquiler actual</span><span>${money(c.alq)}</span></div>${c.exp?`<div><span>Expensas</span><span>${money(c.exp)}</span></div>`:''}${c.iva?`<div><span>IVA 21% sobre alquiler</span><span>${money(c.alq*.21)}</span></div>`:''}<div><span>Depósito</span><span>${c.dep?money(c.dep):'Sin depósito'}</span></div><div><span>Honorario de administración</span><span>5% sobre lo liquidado</span></div></div></div>
  <div class="card"><h3>Garantes y seguro de caución</h3>${c.gar.length?c.gar.map(g=>`<div>${nombre(g)} <span class="muted">· DNI ${pers(g).dni}</span></div>`).join(''):'<div class="muted">Sin garante persona</div>'}<div class="muted">${c.seguro?esc(c.seguro):'Sin seguro de caución'}</div></div></div>
 <div class="card"><h3>Notas</h3><textarea id="notas" rows="2" placeholder="Observaciones del contrato"></textarea>
 <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-go="cobranza" data-p='{"cp":"${cp}"}'>Ir a la cobranza</button><button class="btn" type="button" data-act="renovar">Renovar o prorrogar</button><button class="btn danger" type="button" data-act="rescindir">Rescindir</button></div></div>`;
};

V.persona=p=>{
 const id=p.id,x=pers(id),rs=rolesDe(id),esInq=rs.some(r=>r.rol==='Inquilino'),esPro=rs.some(r=>r.rol==='Propietario');
 const contra=r=>{const c=C(r.cp);if(r.rol==='Inquilino')return prop(r.cp).due.map(o=>nombre(o[0])).join(', ');if(r.rol==='Propietario')return nombre(c.inq);return nombre(c.inq)+' <span class="muted">(inquilino)</span>';};
 const recs=S.recibos.filter(r=>rs.some(q=>q.rol==='Inquilino'&&q.cp===r.carpeta));

 const ownLiq=esPro?pendLiq(id):[];
 return `${help('El archivo de la persona junta todo lo que la vincula: sus contratos y su rol en cada uno, la propiedad, la otra parte, la plata (cobranza, cuenta corriente, recibos o liquidaciones) y el seguimiento. Se abre con el ícono de persona o tocando cualquier nombre.')}

  ${(esInq||esPro)?`<button class="btn" type="button" data-go="acceso" data-p='{"id":"${id}","cp":"${rs[0].cp}"}'>${IC.phone.replace('<svg','<svg width="14" height="14" style="vertical-align:-2px"')} Acceso al portal</button>`:''}</div>
 <div class="grid3"><div class="kv"><span class="lbl">DNI</span>${x.dni}</div><div class="kv"><span class="lbl">Teléfono</span>${x.tel}</div><div class="kv"><span class="lbl">Mail</span>${x.mail||'<span class="muted">sin cargar</span>'}</div>
 ${x.lab?`<div class="kv"><span class="lbl">Datos laborales</span>${esc(x.lab)}</div>`:''}${x.cbu?`<div class="kv"><span class="lbl">CBU</span>${x.cbu==='Cargado'?'Cargado':'<span class="pill warn">Falta cargar</span>'}</div><div class="kv"><span class="lbl">Forma de cobro</span>${x.cobro}</div>`:''}</div></div>
 <div class="card"><h3>Contratos</h3><div class="scroll"><table><thead><tr><th>Carpeta</th><th>Rol</th><th>Propiedad</th><th>La otra parte</th><th>Estado</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${L(r.cp,'contrato',{cp:r.cp})}</td><td>${r.rol}</td><td>${L(esc(prop(r.cp).dir),'propiedad',{pr:C(r.cp).prop})}</td><td>${contra(r)}</td><td>${estado(r.cp)}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="grid2">
 <div class="card"><h3>Plata</h3>${esInq?rs.filter(r=>r.rol==='Inquilino').map(r=>`<div class="row">${L('Cobranza '+r.cp,'cobranza',{cp:r.cp},'btn sm')}${L('Cuenta corriente '+r.cp,'cta',{cp:r.cp},'btn sm')}</div>`).join(''):''}
  ${esInq?`<div><span class="lbl">Recibos</span>${recs.length?recs.slice(-4).reverse().map(r=>`<div><button class="lnk" type="button" data-act="verrecibo" data-n="${r.n}">Recibo ${String(r.n).padStart(4,'0')}</button> <span class="muted">${fdate(r.fecha)} · ${money(r.total)}</span></div>`).join(''):'<div class="muted">Sin recibos</div>'}</div>`:''}
  ${esPro?`<div><span class="lbl">Liquidaciones</span><div>${ownLiq.length?`Pendiente: <b>${money(ownLiq.reduce((a,q)=>a+q.monto,0)*.95)}</b> neto `+L('Liquidar','liquidacion',{id},'btn sm'):'<span class="muted">Nada pendiente de liquidar</span>'}</div>${S.liqs.filter(l=>l.owner===id).map(l=>`<div class="muted">Liquidación ${String(l.n).padStart(4,'0')} · ${money(l.neto)}</div>`).join('')}</div>`:''}
  ${!esInq&&!esPro?'<p class="muted" style="margin:0">Es garante: no paga ni cobra, pero queda guardado en cada contrato que garantiza.</p>':''}</div>

  <div><span class="lbl">Gestiones</span>${gs.length?gs.map(g=>`<div>${L(g.carpeta,'contrato',{cp:g.carpeta})} · ${fdate(g.fecha)} · ${esc(g.tipo)} · <span class="muted">${esc(g.res)}</span></div>`).join(''):'<div class="muted">Sin gestiones</div>'}</div></div></div>`;
};

V.propiedad=p=>{

 return `${help('El archivo de la propiedad tiene sus datos administrativos, los propietarios con su % y todos los contratos que tuvo, cada uno con su carpeta.')}
 <div class="card"><span class="lbl">${r.hub} · ${r.tipo}</span><h1>${esc(r.dir)}</h1><span class="muted">${esc(r.loc)}</span>

V.liquidacion=p=>{

 const inc=[];filas.forEach(f=>{if(sel.includes(f.cp))f.pc.forEach(q=>inc.push({...q,adel:false}));if(adv.includes(f.cp))f.sc.forEach(q=>inc.push({...q,adel:true}));});
 const cob=inc.filter(q=>!q.adel).reduce((a,q)=>a+q.monto,0),ade=inc.filter(q=>q.adel).reduce((a,q)=>a+q.monto,0),tot=cob+ade,h=Math.round(tot*.05);
 const gastos=S.gastosProp.filter(g=>g.owner===o&&!g.liq),gt=gastos.reduce((a,g)=>a+g.monto,0);

  <td class="num">${f.cob?money(f.cob):'<span class="muted">—</span>'}</td><td>${f.pc.length?`<input type="checkbox" data-lsel="${f.cp}" ${sel.includes(f.cp)?'checked':''} aria-label="Liquidar lo cobrado de ${f.cp}">`:'<span class="muted">Nada cobrado</span>'}</td>
  <td class="num">${f.deb?money(f.deb):'<span class="muted">—</span>'}</td><td>${f.sc.length?`<label class="row" style="gap:6px"><input type="checkbox" data-ladv="${f.cp}" ${adv.includes(f.cp)?'checked':''}> <span class="pill warn">sale de la inmobiliaria</span></label>`:'<span class="muted">Al día</span>'}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h3>Detalle</h3>${inc.length?`<div class="scroll"><table><thead><tr><th>Carpeta</th><th>Concepto</th><th>Origen</th><th class="num">%</th><th class="num">Le corresponde</th></tr></thead><tbody>${inc.map(q=>`<tr><td>${L(q.cp,'contrato',{cp:q.cp})}</td><td>${esc(q.x.desc)}</td><td>${q.adel?'<span class="pill warn">Adelanto de la inmobiliaria</span>':'<span class="pill good">Pagó el inquilino</span>'}</td><td class="num">${q.pct}%</td><td class="num">${money(q.monto)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Marcá al menos un contrato arriba.</p>'}
 <div class="eq"><div><span>Cobrado a inquilinos</span><span>${money(cob)}</span></div>${ade?`<div><span>Adelanto de la inmobiliaria</span><span>${money(ade)}</span></div>`:''}<div><span>− Honorario 5% sobre el total</span><span>${money(-h)}</span></div>${gastos.map(g=>`<div><span>− ${esc(g.desc)}</span><span>${money(-g.monto)}</span></div>`).join('')}${red?`<div><span>Redondeo</span><span>${money(rn-neto)}</span></div>`:''}<div class="t"><span>Neto a pagar</span><span>${money(rn)}</span></div></div>

 ${pers(o).cbu!=='Cargado'?'<span class="pill warn">Este propietario no tiene CBU cargado: se le paga en efectivo o hay que cargarlo.</span>':''}

};

 'np-save'(){const c=$('#np-calle').value.trim(),n=$('#np-num').value.trim();if(!c||!n){toast('Faltan la calle o el número');return;}
  const k='P'+(Object.keys(S.PR).length+1+Math.floor(Math.random()*900));const pd=$('#np-pd').value.trim();
  S.PR[k]={dir:c+' '+n+(pd?', '+pd:''),loc:$('#np-loc').value,hub:'PARRA-0'+(200+Object.keys(S.PR).length),tipo:$('#np-tipo').value,partida:$('#np-par').value||'—',luz:$('#np-luz').value||'—',agua:$('#np-agua').value||'—',due:[[$('#np-o1').value,+$('#np-p1').value||100]]};
  toast('Propiedad creada');go('propiedad',{pr:k},false);},
 'nc-save'(){let inq=$('#nc-inq').value;if(inq==='nuevo'){const n=$('#nc-nom').value.trim();if(!n){toast('Falta el nombre del inquilino');$('#nc-nom').focus();return;}inq='I'+(100+Object.keys(S.P).length);S.P[inq]={n,dni:$('#nc-dni').value||'—',tel:'—',mail:'',lab:''};}
  const cp=crearContrato($('#nc-pr').value,inq,$('#nc-gar').value,$('#nc-desde').value||'2026-11',+$('#nc-cuo').value,+$('#nc-alq').value,+$('#nc-dep').value);toast('Contrato creado en la carpeta '+cp);go('contrato',{cp},false);},
 'ia-leer'(){const prs=Object.keys(S.PR);const NOM=['Agustina Paz','Bruno Salas','Camila Ferreyra','Daniel Quiroga','Estefanía Rey'];
  cur.p={leido:{pr:prs[Math.floor(Math.random()*prs.length)],nom:NOM[Math.floor(Math.random()*NOM.length)],dni:(20+Math.floor(Math.random()*25))+'.'+String(Math.floor(Math.random()*1000)).padStart(3,'0')+'.'+String(Math.floor(Math.random()*1000)).padStart(3,'0'),desde:'2026-12',cuo:36,alq:Math.round((300000+Math.random()*400000)/5000)*5000,dep:400000,gar:'Garante con recibo de sueldo (leer de nuevo)'}};render();},
 'ia-otro'(){ACT['ia-leer']();},
 'ia-ok'(){const f=cur.p.leido,inq='I'+(100+Object.keys(S.P).length);S.P[inq]={n:f.nom,dni:f.dni,tel:'—',mail:'',lab:''};const cp=crearContrato(f.pr,inq,'',f.desde,f.cuo,f.alq,f.dep);toast('Contrato aprobado en la carpeta '+cp);go('contrato',{cp},false);},
 hidehelp(){ayudas=false;$('#helpt').textContent='Mostrar ayudas';render();},
 atrasar(){cur.p={...cur.p,atrasar:!cur.p.atrasar};render();},
 adelantar(){cur.p={...cur.p,ade:Math.min((cur.p.ade||0)+1,maxAde(cur.p.cp)),sel:undefined,abon:undefined};render();},
 ajuste(b){const x=S.cargos.find(q=>q.id==b.dataset.id);
  pedirMotivo('Ajustar el monto',`${esc(x.desc)}. El monto no se pisa: queda un ajuste con motivo.`,`<label class="field"><span>Monto nuevo ($)</span><input id="nm" type="number" value="${x.monto}"></label>`,(m,o)=>{const v=+o.querySelector('#nm').value;x.ajustes.push({de:x.monto,a:v,motivo:m});x.monto=v;cur.p.abon=undefined;toast('Ajuste guardado');render();});},
 anular(b){const x=S.cargos.find(q=>q.id==b.dataset.id);
  pedirMotivo('Anular el cargo',`${esc(x.desc)}. No se borra: queda visible como anulado.`,'',m=>{x.estado='anulado';x.motivo=m;cur.p.sel=undefined;cur.p.abon=undefined;toast('Cargo anulado');render();});},
 imprimir(){const cp=cur.p.cp,v=vencidos(cp);modal('Aviso de deuda',`<p class="muted" style="margin-top:0">Se imprime sin registrar ningún cobro.</p><table><tbody>${v.map(x=>`<tr><td>${esc(x.desc)}</td><td class="num">${money(x.monto+pun(x).monto)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${money(deuda(cp))}</b></td></tr></tbody></table>`,[{label:'Cerrar',primary:true}]);},
 confirmar(){const cp=cur.p.cp,ver=verCob(cp,cur.p),sel=cur.p.sel||ver.map(x=>x.id);let its=ver.filter(x=>sel.includes(x.id)).sort((a,b)=>a.vence<b.vence?-1:1);
  const tot=its.reduce((a,x)=>a+x.monto+pun(x).monto,0),ab=cur.p.abon??tot,forma=$('#forma').value,nota=$('#nota').value;
  const neg=its.filter(x=>x.monto<0);its=its.filter(x=>x.monto>0);let resto=ab-neg.reduce((a,x)=>a+x.monto,0);const plan=its.map(x=>{const p=pun(x).monto,need=x.monto+p,pay=Math.min(resto,need);resto-=pay;return {x,p,pay,need};}).filter(q=>q.pay>0);
  const queda=tot-ab;
  modal('Revisión del cobro',`<table><thead><tr><th>Cargo</th><th class="num">Debe</th><th class="num">Se aplica</th></tr></thead><tbody>${plan.map(q=>`<tr><td>${esc(q.x.desc)}${q.p?' + punitorio':''}</td><td class="num">${money(q.need)}</td><td class="num">${money(q.pay)}</td></tr>`).join('')}</tbody></table>
   <div class="eq" style="margin-top:8px">${neg.length?`<div><span>Saldo a favor que se aplica</span><span>${money(-neg.reduce((a,x)=>a+x.monto,0))}</span></div>`:''}<div><span>Abonado (${forma.toLowerCase()})</span><span>${money(ab)}</span></div><div class="t"><span>${queda>0?'Queda debiendo':queda<0?'Saldo a favor':'Saldo'}</span><span>${money(Math.abs(queda))}</span></div></div>
   <p class="muted">El pago se aplica primero al punitorio y a la cuota más vieja.${plan.some(q=>q.x.adel&&q.x.adel.length)?' Parte de lo que se cobra ya se le adelantó al propietario: recupera el adelanto de la inmobiliaria y no se le vuelve a liquidar.':''}</p>`,
   [{label:'Volver'},{label:'Confirmar y emitir recibo',primary:true,fn:()=>{
    const items=[];plan.forEach(q=>{let punPag=Math.min(q.p,q.pay),cap=q.pay-punPag;
     if(cap>=q.x.monto){q.x.estado='pagado';items.push({id:q.x.id,desc:q.x.desc,monto:q.x.monto,pun:punPag});}
     else{const rest={...q.x,id:S.nextId++,monto:q.x.monto-cap,desc:q.x.desc+' (saldo)',ajustes:[],liq:q.x.liq.slice(),adel:(q.x.adel||[]).slice()};q.x.monto=cap;q.x.estado='pagado';q.x.desc+=' (pago parcial)';S.cargos.push(rest);items.push({id:q.x.id,desc:q.x.desc,monto:cap,pun:punPag});}});
    neg.forEach(x=>{x.estado='pagado';items.push({id:x.id,desc:x.desc+' (aplicado)',monto:x.monto,pun:0});});const r={n:S.nextRecibo++,fecha:'2026-10-29',carpeta:cp,items,total:ab,forma,nota};if(resto>0)S.cargos.push({id:S.nextId++,carpeta:cp,mes:'2026-10',vence:'2026-10-29',estado:'pendiente',liq:[],ajustes:[],cuenta:'Saldo a favor',desc:'Saldo a favor del recibo '+String(r.n).padStart(4,'0'),monto:-resto});items.forEach(i=>{const x=S.cargos.find(q=>q.id===i.id);x.recibo=r.n;});
    S.recibos.push(r);S.caja.push({fecha:'2026-10-29',cuenta:'Alquiler',cp,concepto:'Recibo '+String(r.n).padStart(4,'0'),entrada:ab,salida:0,forma});
    cur.p={cp};setTimeout(()=>{render();verRecibo(r.n);},0);}}],true);},
 verrecibo(b){verRecibo(b.dataset.n);},
 'ce-prev'(){const n=+$('#ce-cant').value,m=+$('#ce-mon').value,con=$('#ce-con').value,det=$('#ce-det').value;const ms=['2026-11','2026-12','2027-01','2027-02','2027-03','2027-04'].slice(0,n);
  $('#ce-out').innerHTML=`<table><thead><tr><th>Mes</th><th>Cargo</th><th class="num">Monto</th></tr></thead><tbody>${ms.map(x=>`<tr><td>${mesTxt(x)}</td><td>${esc(con+(det?' – '+det:''))}</td><td class="num">${money($('#ce-inq').value==='Descontar del pago'?-m:m)}</td></tr>`).join('')}</tbody></table>`;},
 'ce-save'(){const cp=cur.p.cp,n=+$('#ce-cant').value,m=+$('#ce-mon').value,con=$('#ce-con').value,det=$('#ce-det').value,ef=$('#ce-inq').value;
  if(ef==='Sin efecto'){toast('Guardado: no le suma nada al inquilino');return;}
  ['2026-11','2026-12','2027-01','2027-02','2027-03','2027-04'].slice(0,n).forEach(x=>S.cargos.push({id:S.nextId++,carpeta:cp,mes:x,vence:x+'-10',estado:'pendiente',liq:[],ajustes:[],cuenta:con==='Expensas'?'Expensas':'Alquiler',desc:con+(det?' – '+det:'')+' '+mesTxt(x),monto:ef==='Descontar del pago'?-m:m}));
  toast(n+' cargos creados. Se ven con "Adelantar período"');cur.p={cp,tab:'Datos principales',ade:Math.min(n,maxAde(cp))};render();},
 'cc-save'(){const m=+$('#cc-m').value,g=$('#cc-g').value;const ks=[...document.querySelectorAll('[data-cc]')].filter(c=>c.checked).map(c=>c.dataset.cc);
  const pcts=ks.map(k=>+document.querySelector(`[data-ccp="${k}"]`).value),sum=pcts.reduce((a,b)=>a+b,0);if(!ks.length||sum!==100){toast('Los % tienen que sumar 100 (ahora suman '+sum+')');return;}
  ks.forEach((k,i)=>S.cargos.push({id:S.nextId++,carpeta:k,mes:'2026-11',vence:'2026-11-10',estado:'pendiente',liq:[],ajustes:[],cuenta:'Alquiler',desc:g+' ('+pcts[i]+'%)',monto:Math.round(m*pcts[i]/100)}));toast('Gasto repartido en '+ks.length+' contratos');},
 'cd-save'(){const cp=cur.p.cp,m=+$('#cd-m').value,pc=+$('#cd-p').value,g=$('#cd-g').value;const inq=Math.round(m*pc/100);
  if(inq)S.cargos.push({id:S.nextId++,carpeta:cp,mes:'2026-11',vence:'2026-11-10',estado:'pendiente',liq:[],ajustes:[],cuenta:'Alquiler',desc:g+' (parte inquilino '+pc+'%)',monto:inq});
  dueños(cp).forEach(o=>S.gastosProp.push({owner:o[0],desc:g+' (parte propietario)',monto:Math.round((m-inq)*o[1]/100)}));toast('Dividido: la parte del propietario se descuenta en su liquidación');},
 'cp-save'(){const cp=cur.p.cp,m=+$('#cp-m').value,g=$('#cp-g').value,t=$('#cp-t').value,mot=$('#cp-mot').value.trim();if(!mot){toast('Falta el motivo');$('#cp-mot').focus();return;}
  S.cargos.push({id:S.nextId++,carpeta:cp,mes:'2026-10',vence:'2026-10-29',estado:'pendiente',liq:[],ajustes:[],cuenta:'Alquiler',desc:g+' · '+mot,monto:t==='Descontar del pago'?-m:m});toast('Guardado. Ya aparece en Datos principales');cur.p={cp,tab:'Datos principales'};render();},
 visor(){visor();},
 descargar(){toast('En el prototipo no se descarga nada');},
 renovar(){modal('Renovar o prorrogar',`<div class="grid2"><label class="row"><input type="radio" name="rr" checked> <span><b>Renovar</b><br><span class="muted">Contrato nuevo precargado con este, en la misma carpeta.</span></span></label><label class="row"><input type="radio" name="rr"> <span><b>Prorrogar</b><br><span class="muted">Un tramo más del mismo contrato.</span></span></label></div><div class="grid2" style="margin-top:10px"><label class="field"><span>Desde</span><input type="date" value="2027-01-01"></label><label class="field"><span>Cuotas</span><input type="number" value="36"></label></div>`,[{label:'Cancelar'},{label:'Continuar',primary:true,after:()=>toast('En el prototipo no se crea el contrato')}]);},
 rescindir(){pedirMotivo('Rescindir','Calcula la penalidad pactada y el contrato pasa a "en rescisión". No se borra nada.','<label class="field"><span>Fecha de rescisión</span><input type="date"></label>',()=>{toast('En el prototipo no se rescinde');});},
 subir(){toast('En el prototipo no se suben archivos');},
 'ac-gen'(){$('#ac-p').value=Math.random().toString(36).slice(2,8);},
 'ac-save'(){const id=cur.p.id,u=$('#ac-u').value.trim(),p=$('#ac-p').value.trim();if(!u||!p){toast('Faltan el usuario o la contraseña');return;}S.accesos[id]={u,p};toast('Cuenta creada');render();},
 'ac-copy'(){const id=cur.p.id,u=$('#ac-u').value,p=$('#ac-p').value;const t=`Hola ${pers(id).n}, para ver tu cuenta entrá a portal.parrapropiedadesfv.com (ejemplo). Usuario: ${u}. Contraseña provisoria: ${p}.`;
  const ok=()=>toast('Datos copiados');if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>modal('Copiá estos datos',`<textarea rows="4">${esc(t)}</textarea>`));else modal('Copiá estos datos',`<textarea rows="4">${esc(t)}</textarea>`);},
 alerta(){toast('En el prototipo no se programa la alerta');},
 portal(b){const cp=cur.p.cp,id=cur.p.id;if(b.dataset.rol==='Propietario'){const it=pendLiq(id),c=it.reduce((a,q)=>a+q.monto,0);
   modal('Lo que ve el propietario',`<div class="phone"><b>Hola, ${esc(pers(id).n.split(' ')[0])}</b><div class="card"><span class="lbl">Por liquidar</span><b>${money(c*.95)}</b><span class="muted">neto, ya cobrado al inquilino</span></div><div><span class="lbl">Pendiente de cobrar</span><div>${rolesDe(id).filter(r=>r.rol==='Propietario').map(r=>`${r.cp}: ${deuda(r.cp)?money(deuda(r.cp)):'al día'}`).join('<br>')}</div></div><div><span class="lbl">Liquidaciones</span><div class="muted">Septiembre 2026</div></div></div>`);}
  else modal('Lo que ve el inquilino',`<div class="phone"><b>Hola, ${esc(pers(id).n.split(' ')[0])}</b><div class="card"><span class="lbl">A pagar</span><b>${money(deuda(cp)||pend(cp).filter(x=>x.mes==='2026-11').reduce((a,x)=>a+x.monto,0))}</b><span class="muted">${deuda(cp)?'vencido, con punitorios':'vence el 10/11/2026'}</span></div><div><span class="lbl">Recibos</span>${S.recibos.filter(r=>r.carpeta===cp).slice(-3).reverse().map(r=>`<div>Recibo ${String(r.n).padStart(4,'0')} · ${money(r.total)}</div>`).join('')}</div></div>`);},
 cerrardia(){S.cerradoHoy=true;toast('Día cerrado. Ya no se puede tocar');render();},
 cierremes(){const caja=S.caja.reduce((a,m)=>a+m.entrada-m.salida,0),fond=owners().reduce((a,o)=>a+pendLiq(o).reduce((s,q)=>s+q.monto,0),0),hon=Math.round(fond*.05),dep=Object.values(S.C).reduce((a,c)=>a+c.dep,0)*0.1,dif=caja-(fond-hon)-dep-hon;
  modal('Cierre de octubre',`<div class="eq"><div><span>Plata en cajas y bancos</span><span>${money(caja)}</span></div><div><span>Fondos de propietarios sin liquidar</span><span>${money(fond-hon)}</span></div><div><span>Depósitos en custodia (ejemplo)</span><span>${money(dep)}</span></div><div><span>Honorarios no retirados</span><span>${money(hon)}</span></div><div class="t"><span>Diferencia a explicar</span><span>${money(dif)}</span></div></div><p class="muted">${Math.abs(dif)>0?'Con diferencia sin explicar el mes no se cierra. Se carga cada diferencia con su motivo y recién ahí se bloquea.':'Cuadra: se puede cerrar y bloquear el mes.'}</p>`,[{label:'Cerrar'}]);},
 avisar(b){const cp=b.dataset.cp;S.gestiones.push({carpeta:cp,fecha:'2026-10-29',tipo:'Aviso por WhatsApp',con:'Inquilino',res:'Enviado'});toast('Aviso anotado. En el CRM se abre WhatsApp con el mensaje armado');render();},
 avisartodos(){morosos().forEach(cp=>S.gestiones.push({carpeta:cp,fecha:'2026-10-29',tipo:'Aviso por WhatsApp',con:'Inquilino',res:'Enviado'}));toast('Avisos anotados para '+morosos().length+' contratos');render();},
 gestion(b){const cp=b.dataset.cp;modal('Registrar gestión · '+cp,`<div class="grid2"><label class="field"><span>Tipo</span><select id="g-t"><option>Llamado</option><option>Intimación</option><option>Carta documento</option><option>Visita</option></select></label><label class="field"><span>Con quién</span><select id="g-c"><option>Inquilino</option><option>Garante</option></select></label></div><label class="field"><span>Resultado</span><input id="g-r" placeholder="Ej.: Promete pagar el viernes"></label>`,
  [{label:'Cancelar'},{label:'Guardar',primary:true,fn:o=>{S.gestiones.push({carpeta:cp,fecha:'2026-10-29',tipo:o.querySelector('#g-t').value,con:o.querySelector('#g-c').value,res:o.querySelector('#g-r').value||'Sin resultado'});},after:()=>{toast('Gestión guardada');render();}}]);},
 acuerdo(b){const cp=b.dataset.cp,v=vencidos(cp),t=deuda(cp);modal('Acuerdo de pago · '+cp,`<p style="margin-top:0">Junta la deuda vencida (${money(t)}, con punitorios) en cuotas. Si incumple 2, el acuerdo cae y vuelve la deuda original.</p><label class="field"><span>Cantidad de cuotas</span><select id="a-n"><option>2</option><option selected>3</option><option>6</option></select></label><div id="a-prev" class="muted"></div>`,
  [{label:'Cancelar'},{label:'Crear acuerdo',primary:true,fn:o=>{S.gestiones.push({carpeta:cp,fecha:'2026-10-29',tipo:'Acuerdo de pago',con:'Inquilino',res:o.querySelector('#a-n').value+' cuotas de '+money(t/o.querySelector('#a-n').value)});},after:()=>{toast('Acuerdo anotado (en el prototipo no cambia las cuotas)');render();}}]);
  const upd=()=>{const n=+document.querySelector('#a-n').value;document.querySelector('#a-prev').textContent=n+' cuotas de '+money(t/n)+' (sin interés en el ejemplo).';};upd();document.querySelector('#a-n').onchange=upd;},
 adelanto(b){modal('Adelantar pago',`<p style="margin-top:0">Se le da plata al propietario antes de que pague el inquilino, y se descuenta en la próxima liquidación.</p><label class="field"><span>Monto ($)</span><input id="ad-m" type="number" value="100000"></label>`,[{label:'Cancelar'},{label:'Guardar',primary:true,fn:o=>{S.gastosProp.push({owner:b.dataset.id,desc:'Adelanto del 29/10',monto:+o.querySelector('#ad-m').value});S.caja.push({fecha:'2026-10-29',cuenta:'Liquidación',per:b.dataset.id,concepto:'Adelanto',entrada:0,salida:+o.querySelector('#ad-m').value,forma:'Efectivo'});},after:()=>{toast('Adelanto guardado: se descuenta abajo');render();}}]);},
 liquidar(b){const o=b.dataset.id,neto=+b.dataset.neto,h=+b.dataset.h,ade=+b.dataset.ade,pg=cur.p;
  const pag=pendLiq(o),cps=cpsDe(o),sel=pg.sel||cps.filter(cp=>pag.some(q=>q.cp===cp)),adv=pg.adv||[];
  pag.filter(q=>sel.includes(q.cp)).forEach(q=>q.x.liq.push(o));
  adv.forEach(cp=>sinCobrar(o,cp).forEach(q=>{q.x.liq.push(o);q.x.adel=(q.x.adel||[]).concat(o);}));
  S.gastosProp.filter(g=>g.owner===o).forEach(g=>g.liq=true);
  const l={n:S.nextLiq++,owner:o,neto,h,ade};S.liqs.push(l);S.caja.push({fecha:'2026-10-29',cuenta:'Liquidación',per:o,concepto:'Liquidación '+String(l.n).padStart(4,'0')+(ade?' (incluye adelanto de la inmobiliaria)':''),entrada:0,salida:neto,forma:pers(o).cbu==='Cargado'?'Transferencia':'Efectivo'});
  S.caja.push({fecha:'2026-10-29',cuenta:'Honorarios',per:o,concepto:'Honorario 5%',entrada:h,salida:0,forma:'—'});
  modal('Comprobante de liquidación '+String(l.n).padStart(4,'0'),`<div class="sum"><div><b>${nombre(o)}</b><div class="muted">29/10/2026</div><div style="margin-top:8px">Neto pagado: <b>${money(neto)}</b></div>${ade?`<div class="muted">Incluye ${money(ade)} adelantados por la inmobiliaria</div>`:''}</div><div class="qr" role="img" aria-label="Código QR"></div></div>`,[{label:'Mandar por WhatsApp',after:()=>toast('En el prototipo no se manda nada')},{label:'Listo',primary:true}]);go('liqpend',{},false);},
 avisoaum(){const n=Object.values(S.aprobados).filter(Boolean).length;toast(n?'Se avisaría el aumento a '+n+' inquilinos por WhatsApp':'Primero aprobá algún aumento');},
 generar(){S.generadoDic=true;Object.keys(S.C).forEach(cp=>{const c=C(cp),a=ajustesDic().includes(cp);S.cargos.push({id:S.nextId++,carpeta:cp,mes:'2026-12',vence:'2026-12-10',estado:'pendiente',liq:[],ajustes:[],cuenta:'Alquiler',desc:'Alquiler diciembre/2026'+(a&&!S.aprobados[cp]?' (pendiente de ajuste)':''),monto:a&&S.aprobados[cp]?nuevoMonto(c.alq):c.alq});if(a&&S.aprobados[cp])c.alq=nuevoMonto(c.alq);});
  toast('Cuotas de diciembre generadas, sin duplicar');render();}
};

$('#home').onclick=()=>{stack=[];go('inicio',{},false);};
$('#home').onkeydown=e=>{if(e.key==='Enter'){stack=[];go('inicio',{},false);}};
$('#back').onclick=back;
$('#menu').onclick=()=>{const o=!$('#side').classList.contains('open');$('#side').classList.toggle('open',o);$('#scrim').classList.toggle('open',o);$('#menu').setAttribute('aria-expanded',String(o));};
$('#scrim').onclick=cerrarMenu;
const setTop=()=>document.documentElement.style.setProperty('--toph',$('.top').offsetHeight+'px');setTop();window.addEventListener('resize',setTop);
$('#helpt').onclick=()=>{ayudas=!ayudas;$('#helpt').textContent=ayudas?'Ocultar ayudas':'Mostrar ayudas';render();};
$('#reset').onclick=()=>{S=semilla();stack=[];ayudas=true;$('#helpt').textContent='Ocultar ayudas';go('inicio',{},false);toast('Ejemplo reiniciado');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.overlay');if(o)o.remove();else cerrarMenu();}});
render();
})();
</script>
